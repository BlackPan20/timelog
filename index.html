<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeiterfassung</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    padding: 20px;
}


.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 10px;
}

.navigation h1 {
    font-size: clamp(20px, 3vw, 28px);
}

.navigation div {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.navigation button {
    background: #00ffcc;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

.navigation button:hover {
    transform: scale(1.05);
}


.dashboard {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 20px;
}


.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 100%;
}

.total-hours {
    font-size: clamp(32px, 6vw, 48px);
    font-weight: bold;
    margin-top: 10px;
    color: #00ffcc;
}


.log-list {
    margin-top: 15px;
    max-height: 350px;
    overflow-y: auto;
}

.log-item {
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    font-size: clamp(14px, 2.5vw, 16px);
}


button.primary {
    margin-top: 15px;
    background: #00ffcc;
    color: black;
    border: none;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
    transition: 0.2s;
}

button.primary:hover {
    transform: scale(1.03);
}

button.danger {
    margin-top: 10px;
    background: #ff4d4d;
    color: white;
    border: none;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
}


@media (max-width: 900px) {
    .dashboard {
        grid-template-columns: 1fr;
    }

    .navigation {
        flex-direction: column;
        align-items: flex-start;
    }

    .navigation div {
        width: 100%;
        justify-content: flex-start;
    }

    .card {
        padding: 18px;
    }

    .log-list {
        max-height: 250px;
    }
}


@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .card {
        padding: 15px;
    }

    .navigation button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="navigation">
    <h1>Zeiterfassung</h1>
    <div>
        <button onclick="clearName()">Name löschen</button>
        <button onclick="clearLogs()">Alle Logs löschen</button>
    </div>
</div>

<h2 id="welcome"></h2>

<div class="dashboard">
    
    <div class="card">
        <h3>Gesamtstunden</h3>
        <div class="total-hours" id="totalHours">0</div>
    </div>

    <div class="card">
        <h3>Alle Einträge</h3>
        <div class="log-list" id="logList"></div>
        <button class="primary" onclick="logHours()">Neue Stunden hinzufügen</button>
    </div>

</div>

<script>

let häuser = [
"Georgstraße",
"Knickweg",
"Kettlerstraße",
"Westfalenstraße",
"Scheleheneck"
];

function askName() {
    const name = prompt("Bitte deinen Namen eingeben:");
    if(name){
        localStorage.setItem("name", name);
    }
}

function loadData() {
    let name = localStorage.getItem("name");
    if(!name){
        askName();
        name = localStorage.getItem("name");
    }
    document.getElementById("welcome").innerText = "Hallo " + name;

    renderLogs();
}

function renderLogs() {
    let logs = JSON.parse(localStorage.getItem("logs")) || [];
    let total = 0;
    let list = document.getElementById("logList");
    list.innerHTML = "";

    logs.forEach(log => {
        total += parseFloat(log.hours);

        let div = document.createElement("div");
        div.className = "log-item";
        div.innerHTML = `
            <span>${log.haus}</span>
            <span>${log.hours} h</span>
        `;
        list.appendChild(div);
    });

    document.getElementById("totalHours").innerText = total;
}

function logHours() {
    let hours = prompt("Wie viele Stunden?");
    let hausIndex = prompt("Haus wählen:\n" + häuser.map((h,i)=> i + 1+": " + h).join("\n"));

    if(hours && hausIndex !== null){
        let logs = JSON.parse(localStorage.getItem("logs")) || [];

        logs.push({
            haus: häuser[hausIndex],
            hours: parseFloat(hours)
        });

        localStorage.setItem("logs", JSON.stringify(logs));
        renderLogs();
    }
}

function clearLogs(){
    localStorage.removeItem("logs");
    renderLogs();
}

function clearName(){
    localStorage.removeItem("name");
    location.reload();
}

window.onload = loadData;

</script>
</body>

</html>
